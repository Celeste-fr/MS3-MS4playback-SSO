name: 'Test: Sound library on Windows'

# Builds MuseScore with MSVC (as "Build: Windows" does), runs the sound library tests
# (tst_soundlibrary: the VST 3 host with the MS Test Synth plug-in), and uploads the
# installed MuseScore for trying it. Manual only: Actions -> this workflow -> Run workflow,
# or a push to main or a claude/ branch whose last commit message contains
# [windows-build]. Other pushes skip the job (no runner minutes). The build folder is cached
# between runs (actions/cache: per branch, else any), so a run compiles only what changed.
# msvc_build.bat keeps an existing CMake configuration, so a cached build keeps the build number
# and revision of the run that configured it (MuseScore's About box); a CMakeLists.txt change
# reconfigures by itself. Delete the caches (Actions -> Caches) to start clean.
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'claude/**'

jobs:
  windows_x64:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-build]') }}
    runs-on: windows-2022
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: 'true'
        fetch-depth: 0          # (the history: each file's last commit time, below)
    # The build folder of an earlier run, so that only what changed is compiled again (the
    # owner, 2026-09-27: every build compiled everything). A checkout gives every file the time
    # of the checkout, which would make MSBuild compile everything anyway: each file gets back
    # the time of the last commit that changed it, older than the objects built from it before.
    - name: Restore the build folder of an earlier run
      uses: actions/cache/restore@v4
      with:
        path: msvc.build_x64
        key: msvc-build-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          msvc-build-${{ github.ref_name }}-
          msvc-build-
    - name: Files' times from their last commit
      shell: python
      run: |
        import os, subprocess
        out = subprocess.run(["git", "-c", "core.quotepath=off", "log", "--format=@%ct", "--name-only"], capture_output=True, text=True, check=True).stdout
        seen, t = set(), 0
        for line in out.splitlines():
            if line.startswith("@"):
                t = int(line[1:])
            elif line and line not in seen:
                seen.add(line)
                if os.path.isfile(line):
                    os.utime(line, (t, t))
        # a submodule's files: its commit's time
        subs = subprocess.run(["git", "submodule", "--quiet", "foreach", "--recursive", "echo $sm_path"], capture_output=True, text=True).stdout.split()
        for sub in subs:
            st = int(subprocess.run(["git", "-C", sub, "log", "-1", "--format=%ct"], capture_output=True, text=True).stdout.strip() or 0)
            for root, dirs, files in os.walk(sub):
                for f in files:
                    os.utime(os.path.join(root, f), (st, st))
        print(len(seen), "files dated,", len(subs), "submodules")
    - name: Setup environment
      run: |
        build\ci\windows\setup.bat
    - name: Build MuseScore
      shell: cmd
      run: |
        XCOPY "C:\musescore_dependencies" %CD% /E /I /Y
        SET "PATH=C:\Qt\5.15.2\msvc2019_64\bin;C:\Program Files (x86)\Jack;%PATH%"
        CALL msvc_build.bat relwithdebinfo 64 %GITHUB_RUN_ID% || exit /b 1
        CALL msvc_build.bat installrelwithdebinfo 64 %GITHUB_RUN_ID% || exit /b 1
    # (on MSVC mtest/ is a project of its own, not in MuseScore's solution: its vcxproj is
    # built with MSBuild, which builds the projects it references too)
    - name: Build the sound library tests
      shell: cmd
      run: |
        SET "PATH=C:\Qt\5.15.2\msvc2019_64\bin;%PATH%"
        FOR /F "usebackq tokens=*" %%i IN (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe`) DO SET "MSBUILD=%%i"
        ECHO MSBuild: %MSBUILD%
        "%MSBUILD%" msvc.build_x64\mtest\libmscore\soundlibrary\tst_soundlibrary.vcxproj /p:Configuration=RelWithDebInfo /p:Platform=x64 /m /v:minimal || exit /b 1
    - name: Keep the build folder for the next run (MuseScore and the tests)
      if: ${{ always() }}
      uses: actions/cache/save@v4
      with:
        path: msvc.build_x64
        key: msvc-build-${{ github.ref_name }}-${{ github.sha }}
    - name: Run the sound library tests
      shell: cmd
      run: |
        SET "PATH=C:\Qt\5.15.2\msvc2019_64\bin;%CD%\msvc.install_x64\bin;%CD%\dependencies\libs\Win64;%PATH%"
        SET QT_QPA_PLATFORM=offscreen
        cd msvc.build_x64\mtest\libmscore\soundlibrary
        FOR /R %%F IN (tst_soundlibrary.exe) DO IF EXIST "%%F" SET TST=%%F
        IF NOT DEFINED TST (DIR /S /B & exit /b 1)
        REM (the results to a file: the console shows none of QtTest's output on Windows)
        "%TST%" -o "%CD%\tst_soundlibrary.txt,txt"
        SET RC=%ERRORLEVEL%
        TYPE "%CD%\tst_soundlibrary.txt"
        FINDSTR /C:"Totals:" "%CD%\tst_soundlibrary.txt" >NUL || exit /b 1
        IF NOT "%RC%"=="0" exit /b 1
    - name: Upload MuseScore (installed)
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: MuseScore-soundlibrary-win64
        path: msvc.install_x64\
