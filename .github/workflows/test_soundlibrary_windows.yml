name: 'Test: Sound library on Windows'

# Builds MuseScore with MSVC (as "Build: Windows" does), runs the sound library tests
# (tst_soundlibrary: the VST 3 host with the MS Test Synth plug-in), and uploads the
# installed MuseScore for trying it. Manual only: Actions -> this workflow -> Run workflow,
# or a push to main or a claude/ branch whose last commit message contains
# [windows-build]. Other pushes skip the job (no runner minutes).
on:
  workflow_dispatch:
  push:
    branches:
      - 'main'
      - 'claude/**'

jobs:
  windows_x64:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows-build]') }}
    runs-on: windows-2022
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        submodules: 'true'
    - name: Setup environment
      run: |
        build\ci\windows\setup.bat
    - name: Copy dependencies
      shell: cmd
      run: |
        XCOPY "C:\musescore_dependencies" %CD% /E /I /Y
    # The last build's folder (objects, precompiled headers, CMake's configuration), so only
    # what changed since is compiled (the owner, 2026-09-27: "don't rebuild everything every
    # time"). A fresh checkout gives every file today's time, which would make MSBuild rebuild
    # all: every file is set back to 2000, then those changed since the cached build's commit
    # (cached-commit.txt) to now. Without a cache, or if anything here fails, it is a full build.
    # Each branch has its own cache (the owner, 2026-09-27: main and a session's branch build
    # different code): the key and restore-keys carry the branch's name, so a branch never
    # starts from another branch's build (GitHub would otherwise give it main's).
    - name: Restore the last build
      id: restore
      continue-on-error: true
      uses: actions/cache/restore@v4
      with:
        path: msvc.build_x64
        key: msvc-build-x64-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: msvc-build-x64-${{ github.ref_name }}-
    - name: Compile only what changed since it
      continue-on-error: true
      shell: pwsh
      run: |
        $marker = "msvc.build_x64\cached-commit.txt"
        if (-not (Test-Path $marker)) { Write-Host "No cached build: a full build."; exit 0 }
        $cached = (Get-Content $marker -Raw).Trim()
        git fetch --no-tags --depth=1 origin $cached 2>&1 | Out-Host
        $changed = git diff --name-only $cached HEAD
        if ($LASTEXITCODE -ne 0) { Write-Host "Cannot compare with $cached; the cached build is dropped."; Remove-Item -Recurse -Force msvc.build_x64; exit 0 }
        $old = Get-Date "2000-01-01"
        Get-ChildItem -Recurse -File -Force | Where-Object { $_.FullName -notmatch '\\(\.git|msvc\.build_x64|msvc\.install_x64)\\' } | ForEach-Object { $_.LastWriteTime = $old }
        $now = Get-Date
        foreach ($f in $changed) { if (Test-Path $f) { (Get-Item $f).LastWriteTime = $now } }
        Write-Host "Cached build of $cached; $(@($changed).Count) files changed since."
    - name: Build MuseScore
      shell: cmd
      run: |
        SET "PATH=C:\Qt\5.15.2\msvc2019_64\bin;C:\Program Files (x86)\Jack;%PATH%"
        CALL msvc_build.bat relwithdebinfo 64 %GITHUB_RUN_ID% || exit /b 1
        CALL msvc_build.bat installrelwithdebinfo 64 %GITHUB_RUN_ID% || exit /b 1
    # (on MSVC mtest/ is a project of its own, not in MuseScore's solution: its vcxproj is
    # built with MSBuild, which builds the projects it references too)
    - name: Build the sound library tests
      shell: cmd
      run: |
        SET "PATH=C:\Qt\5.15.2\msvc2019_64\bin;%PATH%"
        FOR /F "usebackq tokens=*" %%i IN (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe`) DO SET "MSBUILD=%%i"
        ECHO MSBuild: %MSBUILD%
        "%MSBUILD%" msvc.build_x64\mtest\libmscore\soundlibrary\tst_soundlibrary.vcxproj /p:Configuration=RelWithDebInfo /p:Platform=x64 /m /v:minimal || exit /b 1
    - name: Run the sound library tests
      shell: cmd
      run: |
        SET "PATH=C:\Qt\5.15.2\msvc2019_64\bin;%CD%\msvc.install_x64\bin;%CD%\dependencies\libs\Win64;%PATH%"
        SET QT_QPA_PLATFORM=offscreen
        cd msvc.build_x64\mtest\libmscore\soundlibrary
        FOR /R %%F IN (tst_soundlibrary.exe) DO IF EXIST "%%F" SET TST=%%F
        IF NOT DEFINED TST (DIR /S /B & exit /b 1)
        REM (the results to a file: the console shows none of QtTest's output on Windows)
        "%TST%" -o "%CD%\tst_soundlibrary.txt,txt"
        SET RC=%ERRORLEVEL%
        TYPE "%CD%\tst_soundlibrary.txt"
        FINDSTR /C:"Totals:" "%CD%\tst_soundlibrary.txt" >NUL || exit /b 1
        IF NOT "%RC%"=="0" exit /b 1
    - name: Keep this build for the next run
      if: ${{ success() }}
      continue-on-error: true
      shell: pwsh
      run: |
        Set-Content msvc.build_x64\cached-commit.txt "${{ github.sha }}"
    - name: Save the build
      if: ${{ success() }}
      continue-on-error: true
      uses: actions/cache/save@v4
      with:
        path: msvc.build_x64
        key: msvc-build-x64-${{ github.ref_name }}-${{ github.sha }}
    - name: Upload MuseScore (installed)
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: MuseScore-soundlibrary-win64
        path: msvc.install_x64\
